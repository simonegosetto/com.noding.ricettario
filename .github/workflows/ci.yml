name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NG_CLI_ANALYTICS: 'false'

jobs:
  verifica:
    name: Format, lint, unit test e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prettier --check src e2e
      - run: npm run lint
      - run: npx ng test --watch=false
      - run: npm run build
      # Il contenuto di www/ è quello da pubblicare su Apache (vedi README, "Deploy").
      - uses: actions/upload-artifact@v4
        with:
          name: www
          path: www/
          include-hidden-files: true
          retention-days: 14

  e2e:
    name: E2E con backend simulato
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Nessuna richiesta raggiunge la produzione: il dominio è bloccato da e2e/support/backend.ts.
      - run: npx playwright test --grep-invert screenshot
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
