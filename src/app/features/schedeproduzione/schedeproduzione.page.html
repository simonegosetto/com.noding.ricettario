<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button />
    </ion-buttons>
    <ion-title>Schede di produzione</ion-title>
    <ion-buttons slot="end">
      <ion-button aria-label="Nuova scheda" (click)="nuova()">
        <ion-icon slot="icon-only" name="add-circle-outline" />
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
  <ion-toolbar>
    <ion-searchbar
      placeholder="Cerca una scheda"
      [debounce]="150"
      [value]="search()"
      (ionInput)="search.set($event.detail.value ?? '')"
    />
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="schede.load($event)">
    <ion-refresher-content />
  </ion-refresher>

  <div class="app-page ion-padding">
    @switch (schede.state()) {
      @case ('loading') {
        <ric-list-skeleton />
      }
      @case ('error') {
        <ric-empty-state icon="alert-circle-outline" message="Impossibile caricare le schede.">
          <ion-button fill="outline" (click)="schede.load()">Riprova</ion-button>
        </ric-empty-state>
      }
      @default {
        @if (visibili().length) {
          <ion-list class="app-list">
            @for (scheda of visibili(); track scheda.id) {
              <ric-list-row icon="clipboard-outline" (open)="apri(scheda)">
                <h2>{{ scheda.descrizione }}</h2>
                <ion-button actions fill="clear" aria-label="Modifica" (click)="modifica(scheda)">
                  <ion-icon slot="icon-only" name="create-outline" />
                </ion-button>
                <ion-button
                  actions
                  fill="clear"
                  color="danger"
                  aria-label="Elimina"
                  (click)="elimina(scheda)"
                >
                  <ion-icon slot="icon-only" name="trash-outline" />
                </ion-button>
              </ric-list-row>
            }
          </ion-list>
        } @else {
          <ric-empty-state
            icon="clipboard-outline"
            [message]="search() ? 'Nessuna scheda trovata.' : 'Non ci sono ancora schede.'"
          />
        }
      }
    }
  </div>
</ion-content>
