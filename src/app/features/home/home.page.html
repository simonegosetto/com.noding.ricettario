<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button />
    </ion-buttons>
    <ion-title>Home</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="home">
    <ion-grid class="ion-no-padding">
      <ion-row>
        @for (scorciatoia of scorciatoie; track scorciatoia.label) {
          <ion-col size="6" sizeMd="3">
            <ion-button
              class="home__shortcut"
              expand="block"
              fill="outline"
              [routerLink]="scorciatoia.url"
              [queryParams]="scorciatoia.queryParams"
            >
              <ion-icon slot="start" [name]="scorciatoia.icon" aria-hidden="true" />
              {{ scorciatoia.label }}
            </ion-button>
          </ion-col>
        }
      </ion-row>
    </ion-grid>

    <ion-card>
      <ion-card-header>
        <ion-card-title>Blocco note</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <ion-textarea
          aria-label="Blocco note"
          placeholder="Scrivi qui le tue annotazioni..."
          fill="outline"
          [rows]="12"
          [maxlength]="3000"
          [counter]="true"
          [value]="testo()"
          [disabled]="!caricato()"
          (ionInput)="testo.set($event.detail.value ?? '')"
        />
        <div class="ion-text-end ion-padding-top">
          <ion-button [disabled]="!caricato() || busy()" (click)="salva()">
            <ion-icon slot="start" name="save-outline" aria-hidden="true" />
            Salva note
          </ion-button>
        </div>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
