<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button />
    </ion-buttons>
    <ion-title>Listini prezzi</ion-title>
    <ion-buttons slot="end">
      <ion-button aria-label="Nuovo listino" (click)="nuovo()">
        <ion-icon slot="icon-only" name="add-circle-outline" />
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
  <ion-toolbar>
    <ion-searchbar
      placeholder="Cerca un listino"
      [debounce]="150"
      [value]="search()"
      (ionInput)="search.set($event.detail.value ?? '')"
    />
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="listini.load($event)">
    <ion-refresher-content />
  </ion-refresher>

  <div class="app-page ion-padding">
    @switch (listini.state()) {
      @case ('loading') {
        <ric-list-skeleton />
      }
      @case ('error') {
        <ric-empty-state icon="alert-circle-outline" message="Impossibile caricare i listini.">
          <ion-button fill="outline" (click)="listini.load()">Riprova</ion-button>
        </ric-empty-state>
      }
      @default {
        @if (visibili().length) {
          <ion-list class="app-list">
            @for (listino of visibili(); track listino.id) {
              <ric-list-row icon="list-outline" (open)="apri(listino)">
                <h2>{{ listino.descrizione }}</h2>
                <p>IVA {{ listino.aliquota | number: '1.0-2' }}%</p>
                <ion-button actions fill="clear" aria-label="Modifica" (click)="modifica(listino)">
                  <ion-icon slot="icon-only" name="create-outline" />
                </ion-button>
                <ion-button
                  actions
                  fill="clear"
                  color="danger"
                  aria-label="Elimina"
                  (click)="elimina(listino)"
                >
                  <ion-icon slot="icon-only" name="trash-outline" />
                </ion-button>
              </ric-list-row>
            }
          </ion-list>
        } @else {
          <ric-empty-state
            icon="list-outline"
            [message]="search() ? 'Nessun listino trovato.' : 'Non ci sono ancora listini.'"
          />
        }
      }
    }
  </div>
</ion-content>
