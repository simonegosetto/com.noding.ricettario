<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button />
    </ion-buttons>
    <ion-title>Ricette</ion-title>
    <ion-buttons slot="end">
      <ion-button aria-label="Nuova ricetta" (click)="nuova()">
        <ion-icon slot="icon-only" name="add-circle-outline" />
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
  <ion-toolbar>
    <ion-segment
      aria-label="Tipo"
      [value]="tipoRicetta()"
      (ionChange)="cambiaTipo($event.detail.value)"
    >
      <ion-segment-button [value]="tipi.Ricetta">
        <ion-label>Ricette</ion-label>
      </ion-segment-button>
      <ion-segment-button [value]="tipi.SchedaTecnica">
        <ion-label>Schede tecniche</ion-label>
      </ion-segment-button>
    </ion-segment>
  </ion-toolbar>
  <ion-toolbar>
    <ion-searchbar
      placeholder="Cerca una ricetta"
      [debounce]="150"
      [value]="search()"
      (ionInput)="search.set($event.detail.value ?? '')"
    />
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="ricette.load($event)">
    <ion-refresher-content />
  </ion-refresher>

  <div class="app-page ion-padding">
    @switch (ricette.state()) {
      @case ('loading') {
        <ric-list-skeleton />
      }
      @case ('error') {
        <ric-empty-state icon="alert-circle-outline" message="Impossibile caricare le ricette.">
          <ion-button fill="outline" (click)="ricette.load()">Riprova</ion-button>
        </ric-empty-state>
      }
      @default {
        @if (visibili().length) {
          <ion-list class="app-list">
            @for (ricetta of visibili(); track ricetta.cod_p) {
              <ric-list-row
                [icon]="ricetta.composta ? 'layers-outline' : 'document-text-outline'"
                (open)="apri(ricetta)"
              >
                <h2>{{ ricetta.nome_ric }}</h2>
                @if (ricetta.composta) {
                  <p>Con sotto-ricette</p>
                }
                <ion-button actions fill="clear" aria-label="Stampa" (click)="stampa(ricetta)">
                  <ion-icon slot="icon-only" name="print-outline" />
                </ion-button>
                <ion-button
                  actions
                  fill="clear"
                  color="danger"
                  aria-label="Elimina"
                  (click)="elimina(ricetta)"
                >
                  <ion-icon slot="icon-only" name="trash-outline" />
                </ion-button>
              </ric-list-row>
            }
          </ion-list>
        } @else {
          <ric-empty-state
            icon="document-text-outline"
            [message]="search() ? 'Nessuna ricetta trovata.' : 'Non ci sono ancora ricette.'"
          />
        }
      }
    }
  </div>
</ion-content>
